<div class="app-shell">
  <app-sidebar
    class="app-sidebar"
    (hoverState)="onSidebarHover($event)">
  </app-sidebar>

  <div
    class="shell"
    [class.shell-expanded]="isSidebarExpanded">
    
    <app-header></app-header>

    <main class="main">
      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </main>

    <app-footer></app-footer>
  </div>
</div>
