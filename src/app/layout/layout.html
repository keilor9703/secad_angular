<div class="app-shell" [class.menu-open]="isMenuOpen()">
  <app-sidebar class="app-sidebar"></app-sidebar>

  <div class="app-backdrop"
       *ngIf="isMenuOpen()"
       (click)="closeMenu()"
       aria-hidden="true"></div>

  <div class="shell">
    <main class="main">
      <app-header></app-header>

      <div class="content">
        <router-outlet></router-outlet>
      </div>

      <app-footer></app-footer>
    </main>
  </div>
</div>
