<section class="sliders-page" *ngIf="visible">
  <div class="ui-panel">
    <div class="ui-panel__head">
      <div class="ui-panel__title">
        <i class="fa-regular fa-images"></i>
        Administración de Sliders
      </div>

      <div class="ui-panel__actions ui-window-controls">
        <button class="ui-icon-btn ui-win-btn is-min" type="button" title="Minimizar" (click)="toggleMinimize()">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button class="ui-icon-btn ui-win-btn is-close" type="button" title="Cerrar" (click)="closePanel()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="ui-panel__body" *ngIf="!minimized">
      <div class="sliders-grid">
        <article class="tab-card form-card">
          <h3>{{ editingId ? 'Editar slider' : 'Nuevo slider' }}</h3>

          <div class="ui-grid">
            <div class="ui-field ui-col-12">
              <label class="ui-label">Título</label>
              <input class="ui-control" type="text" [(ngModel)]="form.titulo" maxlength="200">
            </div>

            <div class="ui-field ui-col-12">
              <label class="ui-label">Subtítulo</label>
              <textarea class="ui-control" rows="2" [(ngModel)]="form.subtitulo" maxlength="500"></textarea>
            </div>

            <div class="ui-field ui-col-12">
              <label class="ui-label">Cargar imagen</label>
              <input class="ui-control" type="file" accept=".jpg,.jpeg,.png,.webp,image/*" (change)="onImageSelected($event)">
              <small class="meta">Formatos: JPG, PNG, WEBP. Máximo 5MB.</small>
            </div>

            <div class="ui-field ui-col-12" *ngIf="uploadingImage || imagePreviewUrl || form.urlImagen">
              <label class="ui-label">Vista previa</label>
              <div class="image-preview">
                <div class="list-loading" *ngIf="uploadingImage">Subiendo imagen...</div>
                <img *ngIf="!uploadingImage" [src]="imagePreviewUrl || form.urlImagen || ''" alt="Vista previa del banner">
              </div>
            </div>

            <div class="ui-field ui-col-12">
              <label class="ui-label">URL destino</label>
              <input class="ui-control" type="text" [(ngModel)]="form.urlDestino">
            </div>

            <div class="ui-field ui-col-4">
              <label class="ui-label">Orden</label>
              <input class="ui-control" type="number" min="1" [(ngModel)]="form.orden">
            </div>

            <div class="ui-field ui-col-4">
              <label class="ui-label">Fecha inicio</label>
              <input class="ui-control" type="date" [(ngModel)]="form.fechaInicio">
            </div>

            <div class="ui-field ui-col-4">
              <label class="ui-label">Fecha fin</label>
              <input class="ui-control" type="date" [(ngModel)]="form.fechaFin">
            </div>

            <div class="ui-field ui-col-12">
              <label class="ui-label">Vigente</label>
              <select class="ui-control" [(ngModel)]="form.vigente">
                <option [ngValue]="1">Sí</option>
                <option [ngValue]="0">No</option>
              </select>
            </div>
          </div>

          <div class="tab-actions">
            <button class="ui-btn secondary" type="button" (click)="nuevo()">Limpiar</button>
            <button class="ui-btn primary" type="button" (click)="guardar()" [disabled]="saving">
              <i class="fa-solid fa-floppy-disk"></i>
              {{ saving ? 'Guardando...' : 'Guardar' }}
            </button>
          </div>
        </article>

        <article class="tab-card list-card">
          <h3>Sliders registrados</h3>

          <div class="list-loading" *ngIf="loading">Cargando sliders...</div>

          <div class="slider-list" *ngIf="!loading && sliders.length > 0">
            <div class="slider-item" *ngFor="let item of sliders">
              <div class="slider-item__preview">
                <img [src]="item.urlImagen || ''" alt="Preview slider">
              </div>

              <div class="slider-item__content">
                <strong>{{ item.titulo }}</strong>
                <span class="meta">Orden: {{ item.orden }}</span>
                <span class="meta">Vigente: {{ item.vigente === 1 ? 'Sí' : 'No' }}</span>
              </div>

              <div class="slider-item__actions">
                <button class="ui-btn secondary" type="button" (click)="editar(item)">Editar</button>
                <button
                  class="ui-btn"
                  [class.primary]="item.vigente === 0"
                  [class.secondary]="item.vigente === 1"
                  type="button"
                  (click)="cambiarEstado(item)"
                >
                  {{ item.vigente === 1 ? 'Desactivar' : 'Activar' }}
                </button>
              </div>
            </div>
          </div>

          <div class="news-state" *ngIf="!loading && sliders.length === 0">
            No hay sliders registrados.
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
