     <button class="menu-trigger" type="button" (click)="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
        <span>Ver menú</span>
    </button>
    <!-- Barra de Búsqueda -->
    <div class="header-search">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input 
            type="text" 
            placeholder="Buscar..."
            [(ngModel)]="searchQuery"
            (keyup.enter)="onSearch()"
            class="search-input"
        >
        <button class="search-btn" (click)="onSearch()">
            <i class="fa-solid fa-search"></i>
        </button>
    </div>

    <!-- Notificaciones -->
    <div class="header-notifications">
        <button 
            *ngFor="let notif of notifications"
            class="notification-btn"
            [class]="'notification-' + notif.color"
            (click)="onNotificationClick(notif)"
            [title]="notif.tooltip"
        >
            <i [class]="'fa-solid ' + notif.icon"></i>
            <span class="notification-badge" *ngIf="notif.count > 0">
                {{ notif.count > 9 ? '9+' : notif.count }}
            </span>
        </button>
    </div>

    <!-- Usuario -->
    <div class="header-user">
        <div class="user-info" (click)="onProfileClick()">
            <div class="user-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-details">
                <span class="user-name">{{ userName }}</span>
                <span class="user-role">{{ userRole }}</span>
            </div>
            <i class="fa-solid fa-chevron-down"></i>
        </div>

        <!-- Dropdown Menu (opcional) -->
        <div class="user-dropdown">
            <a routerLink="/perfil" class="dropdown-item">
                <i class="fa-solid fa-user-circle"></i>
                Mi Perfil
            </a>
            <a routerLink="/configuracion" class="dropdown-item">
                <i class="fa-solid fa-cog"></i>
                Configuración
            </a>
            <div class="dropdown-divider"></div>
            <a (click)="onLogout()" class="dropdown-item logout">
                <i class="fa-solid fa-sign-out-alt"></i>
                Cerrar Sesión
            </a>
        </div>
    </div>
</header>
