services:
  postgres:
    image: postgres:16-alpine
    container_name: secad-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-Secad}
      - POSTGRES_USER=${POSTGRES_USER:-secad_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - secad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secad_app} -d ${POSTGRES_DB:-Secad}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres del tenant Cali — instancia propia y aislada (volumen propio),
  # separada de la base maestra (servicio "postgres" de arriba). Se registra
  # en SECAD como un tenant más desde Super Admin → Tenants, con
  # dbHost=postgres-cali (nombre de este servicio, resuelto por DNS interno
  # de Docker — igual que "postgres" para la base maestra).
  postgres-cali:
    image: postgres:16-alpine
    container_name: secad-postgres-cali
    environment:
      - POSTGRES_DB=${POSTGRES_CALI_DB:-Secad_Cali}
      - POSTGRES_USER=${POSTGRES_CALI_USER:-secad_cali_app}
      - POSTGRES_PASSWORD=${POSTGRES_CALI_PASSWORD}
      - TZ=America/Bogota
    volumes:
      - pgdata_cali:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - secad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CALI_USER:-secad_cali_app} -d ${POSTGRES_CALI_DB:-Secad_Cali}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres del tenant 11001 (CAD Bogotá D.C.) — la fila de secad_tenants para
  # este cod_dane venía apuntando a un Postgres local de desarrollo
  # (localhost:5433) que no existe en este servidor; se le da su propio
  # contenedor aislado, igual que a Cali. dbHost=postgres-bogota en
  # secad_tenants tras cargar el esquema aquí.
  postgres-bogota:
    image: postgres:16-alpine
    container_name: secad-postgres-bogota
    environment:
      - POSTGRES_DB=${POSTGRES_BOGOTA_DB:-Secad_Bogota}
      - POSTGRES_USER=${POSTGRES_BOGOTA_USER:-secad_bogota_app}
      - POSTGRES_PASSWORD=${POSTGRES_BOGOTA_PASSWORD}
      - TZ=America/Bogota
    volumes:
      - pgdata_bogota:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - secad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOGOTA_USER:-secad_bogota_app} -d ${POSTGRES_BOGOTA_DB:-Secad_Bogota}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: secad-api:latest
    container_name: secad-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8088}:8088"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=America/Bogota
      # ConnectionStrings:MasterDb es la única cadena que Program.cs exige al
      # arrancar (Postgres — el motor real del sistema; Oracle solo se usa para
      # la integración externa GESPO, configurada aparte en appsettings.json).
      # "postgres" es el nombre del servicio de arriba — resuelve por DNS
      # interno de Docker, no es un host externo.
      - ConnectionStrings__MasterDb=Host=postgres;Port=5432;Database=${POSTGRES_DB:-Secad};Username=${POSTGRES_USER:-secad_app};Password=${POSTGRES_PASSWORD}
      # appsettings.json trae Jwt:Key como placeholder ("CAMBIAR_EN_PRODUCCION...") —
      # sin este override el contenedor firmaría tokens con una clave pública y conocida.
      - Jwt__Key=${JWT_KEY}
      # Igual que Jwt:Key: RecepcionExterna:ApiKey también viene como placeholder
      # en appsettings.json y protege los endpoints de ingesta (PlantaTel/Chat/SMS).
      - RecepcionExterna__ApiKey=${RECEPCION_EXTERNA_API_KEY}
      - AppSettings__UploadsPath=/app/uploads
      # Dominio público real de este despliegue — VideoLlamadaController lo usa
      # para armar el link que se envía al ciudadano (.../video/{token}). Sin
      # este override, appsettings.json trae el dominio de producción hardcoded
      # (https://secad.policia.gov.co) y el link de cualquier otro despliegue
      # (staging, otro servidor) apuntaría al lugar equivocado.
      - ApiSettings__SecadBaseUrl=${SECAD_BASE_URL}
      # Envío de SMS del link de videollamada (Infobip). Si se dejan vacías,
      # InfobipProveedorSms degrada solo (log + false) sin romper el flujo — el
      # despachador siempre puede copiar el link manualmente.
      - Sms__Infobip__BaseUrl=${INFOBIP_BASE_URL:-}
      - Sms__Infobip__ApiKey=${INFOBIP_API_KEY:-}
      - Sms__Infobip__Sender=${INFOBIP_SENDER:-}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    networks:
      - secad-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: secad-frontend:latest
    container_name: secad-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - secad-network
      # Red del nginx compartido de otro proyecto ya desplegado en este
      # servidor (falcon-deploy) — necesaria para que ese nginx pueda
      # alcanzar este contenedor por nombre ("secad-frontend") y hacerle
      # reverse proxy a secad.appjeylor.com sin publicar el 80/443 acá
      # (esos puertos ya los tiene tomados falcon-deploy-nginx-1).
      - falcon-deploy_default

volumes:
  uploads:
  pgdata:
  pgdata_cali:
  pgdata_bogota:

networks:
  secad-network:
    driver: bridge
  falcon-deploy_default:
    external: true
