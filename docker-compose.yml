version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sisge-api:latest
    container_name: sisge-api
    ports:
      - "8088:8088"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DbOracle=${DB_ORACLE}
      - AppSettings__UploadsPath=/app/uploads
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
